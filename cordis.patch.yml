# Agent Team Room is split into a durable host service, model-facing tools,
# a Host slash command, and an optional Web dashboard. Web-only rows stay pending
# when their injected services are not part of the active profile.
- insert:
    - id: agent-team-room
      name: 'dsh-agent-team-room'
      config:
        provider: spawn

    - id: agent-team-room-tools
      name: 'dsh-agent-team-room/tools'

    - id: agent-team-room-commands
      name: 'dsh-agent-team-room/commands'

    - id: agent-team-room-dashboard
      name: 'dsh-agent-team-room/dashboard'
