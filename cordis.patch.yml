# Room is split into a durable host service, model-facing tools, a Host slash
# command, and the read-only transport used by its additive native Web UI.
- insert:
    - id: agent-team-room
      name: 'dsh-agent-team-room'
      config:
        maxMembersPerRoom: 16

    - id: agent-team-room-tools
      name: 'dsh-agent-team-room/tools'

    - id: agent-team-room-commands
      name: 'dsh-agent-team-room/commands'

    - id: agent-team-room-native-api
      name: 'dsh-agent-team-room/native-api'
